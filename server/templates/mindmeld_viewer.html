<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 MindMeld Session Viewer</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            gap: 30px;
            margin-top: 15px;
        }

        .stat {
            font-size: 14px;
            color: #666;
        }

        .stat strong {
            color: #667eea;
            font-size: 20px;
            display: block;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            height: calc(100vh - 180px);
        }

        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .sidebar h2 {
            font-size: 18px;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .session-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .session-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .session-item.active {
            background: #667eea;
            color: white;
        }

        .session-item .name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .session-item .meta {
            font-size: 12px;
            opacity: 0.7;
        }

        .content-area {
            background: white;
            border-radius: 12px;
            padding: 30px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .burst-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .burst-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .burst-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .burst-card h3 {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .burst-card .time {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .insight-pill {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .insight-pill.relax {
            background: rgba(76, 175, 80, 0.3);
        }

        .insight-pill.alert {
            background: rgba(255, 152, 0, 0.3);
        }

        .insight-pill.neutral {
            background: rgba(158, 158, 158, 0.3);
        }

        .burst-detail {
            margin-top: 30px;
        }

        .burst-detail h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .waveform-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .insights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .insight-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
        }

        .insight-box h4 {
            font-size: 12px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 8px;
        }

        .insight-box .value {
            font-size: 24px;
            font-weight: 600;
            color: #667eea;
        }

        .band-powers {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .band-powers h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .band-bar {
            margin-bottom: 12px;
        }

        .band-bar .label {
            font-size: 14px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .band-bar .bar {
            height: 25px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }

        .band-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            padding-left: 10px;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        .grok-export {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .grok-export h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .grok-export pre {
            background: #282c34;
            color: #abb2bf;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.6;
        }

        .copy-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .copy-button:hover {
            background: #5568d3;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 MindMeld Session Viewer</h1>
            <div class="stats-bar" id="stats-bar">
                <div class="stat">
                    <strong id="total-sessions">-</strong>
                    Sessions
                </div>
                <div class="stat">
                    <strong id="total-bursts">-</strong>
                    Bursts
                </div>
                <div class="stat">
                    <strong id="relax-count">-</strong>
                    Relax
                </div>
                <div class="stat">
                    <strong id="alert-count">-</strong>
                    Alert
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <h2>📁 Sessions</h2>
                <div id="session-list" class="loading">Loading sessions...</div>
            </div>

            <div class="content-area">
                <div id="content" class="empty-state">
                    <h3>Select a session to view bursts</h3>
                    <p>Your EEG recording sessions will appear in the sidebar</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentSession = null;
        let currentBurst = null;

        // Load stats
        async function loadStats() {
            const response = await fetch('/api/stats');
            const data = await response.json();

            document.getElementById('total-sessions').textContent = data.total_sessions;
            document.getElementById('total-bursts').textContent = data.total_bursts;
            document.getElementById('relax-count').textContent = data.states.relax || 0;
            document.getElementById('alert-count').textContent = data.states.alert || 0;
        }

        // Load sessions
        async function loadSessions() {
            const response = await fetch('/api/sessions');
            const data = await response.json();

            const listDiv = document.getElementById('session-list');

            if (data.sessions.length === 0) {
                listDiv.innerHTML = '<div class="empty-state"><p>No sessions found</p></div>';
                return;
            }

            listDiv.innerHTML = '';

            data.sessions.forEach(session => {
                const div = document.createElement('div');
                div.className = 'session-item';
                div.innerHTML = `
                    <div class="name">${session.name}</div>
                    <div class="meta">${session.num_bursts} bursts • ${new Date(session.timestamp).toLocaleString()}</div>
                `;
                div.onclick = () => loadSession(session.name);
                listDiv.appendChild(div);
            });
        }

        // Load session bursts
        async function loadSession(sessionName) {
            currentSession = sessionName;

            // Update active state
            document.querySelectorAll('.session-item').forEach(item => {
                item.classList.toggle('active', item.querySelector('.name').textContent === sessionName);
            });

            const response = await fetch(`/api/session/${sessionName}`);
            const data = await response.json();

            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <h2>📊 ${sessionName}</h2>
                <div class="burst-list" id="burst-list"></div>
            `;

            const burstListDiv = document.getElementById('burst-list');

            data.bursts.forEach(burst => {
                const card = document.createElement('div');
                card.className = 'burst-card';

                let insights = '';
                if (burst.insights) {
                    const state = burst.insights.state || 'unknown';
                    const band = burst.insights.dominant_band || 'unknown';
                    insights = `
                        <div class="insight-pill ${state}">${state}</div>
                        <div class="insight-pill">${band}</div>
                    `;
                }

                card.innerHTML = `
                    <h3>${burst.burst_id}</h3>
                    <div class="time">${new Date(burst.timestamp).toLocaleString()}</div>
                    ${insights}
                    <div style="margin-top:10px; font-size:12px; opacity:0.8">
                        ${burst.n_samples} samples @ ${burst.sample_rate} Hz
                    </div>
                `;
                card.onclick = () => loadBurst(sessionName, burst.burst_id);
                burstListDiv.appendChild(card);
            });
        }

        // Load burst details
        async function loadBurst(sessionName, burstId) {
            currentBurst = burstId;

            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '<div class="loading">Loading burst data...</div>';

            // Load waveform data
            const waveformResponse = await fetch(`/api/burst/${sessionName}/${burstId}`);
            const waveformData = await waveformResponse.json();

            // Load Grok export
            const grokResponse = await fetch(`/api/grok/${sessionName}/${burstId}`);
            const grokData = await grokResponse.json();

            // Render
            contentDiv.innerHTML = `
                <h2>🔥 ${burstId}</h2>

                <div class="insights-grid">
                    <div class="insight-box">
                        <h4>Brain State</h4>
                        <div class="value">${grokData.insights?.state || 'Unknown'}</div>
                    </div>
                    <div class="insight-box">
                        <h4>Dominant Band</h4>
                        <div class="value">${grokData.insights?.dominant_band || 'Unknown'}</div>
                    </div>
                    <div class="insight-box">
                        <h4>Anomaly Score</h4>
                        <div class="value">${(grokData.insights?.anomaly_score || 0).toFixed(2)}</div>
                    </div>
                    <div class="insight-box">
                        <h4>Sample Rate</h4>
                        <div class="value">${waveformData.sample_rate} Hz</div>
                    </div>
                </div>

                <div class="band-powers">
                    <h3>🎵 Frequency Band Powers</h3>
                    <div id="band-powers"></div>
                </div>

                <div class="waveform-container">
                    <h3>📈 EEG Waveform</h3>
                    <div id="waveform"></div>
                </div>

                <div class="grok-export">
                    <h3>🤖 Grok Export (JSON)</h3>
                    <button class="copy-button" onclick="copyGrokExport()">📋 Copy to Clipboard</button>
                    <pre id="grok-json">${JSON.stringify(grokData, null, 2)}</pre>
                </div>
            `;

            // Render band powers
            if (grokData.insights?.powers) {
                const powers = grokData.insights.powers;
                const maxPower = Math.max(...Object.values(powers));

                const bandPowersDiv = document.getElementById('band-powers');
                Object.entries(powers).forEach(([band, power]) => {
                    const percentage = (power / maxPower) * 100;
                    const div = document.createElement('div');
                    div.className = 'band-bar';
                    div.innerHTML = `
                        <div class="label">
                            <span>${band.charAt(0).toUpperCase() + band.slice(1)}</span>
                            <span>${power.toFixed(2)}</span>
                        </div>
                        <div class="bar">
                            <div class="fill" style="width: ${percentage}%">${percentage.toFixed(0)}%</div>
                        </div>
                    `;
                    bandPowersDiv.appendChild(div);
                });
            }

            // Render waveform
            const traces = waveformData.channel_names.map((channel, i) => ({
                x: waveformData.time_axis,
                y: waveformData.data.map(row => row[i]),
                name: channel,
                type: 'scatter',
                mode: 'lines'
            }));

            Plotly.newPlot('waveform', traces, {
                title: 'EEG Channels',
                xaxis: { title: 'Time (s)' },
                yaxis: { title: 'Amplitude (µV)' },
                height: 500
            });
        }

        function copyGrokExport() {
            const jsonText = document.getElementById('grok-json').textContent;
            navigator.clipboard.writeText(jsonText);
            alert('Grok export copied to clipboard! Paste it to Grok for analysis.');
        }

        // Initialize
        loadStats();
        loadSessions();
    </script>
</body>
</html>
